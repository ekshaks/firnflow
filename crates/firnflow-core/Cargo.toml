[package]
name = "firnflow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tiered storage primitives for firnflow: namespace manager, LanceDB wrapper, foyer cache."

[dependencies]
foyer.workspace = true
tokio.workspace = true
serde.workspace = true
dashmap.workspace = true
xxhash-rust.workspace = true
thiserror.workspace = true
tracing.workspace = true
lancedb.workspace = true
lance.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
bincode.workspace = true
prometheus.workspace = true
object_store.workspace = true
# object cache (issue #51): byte-range NVMe cache wrapped under Lance via a
# custom ObjectStoreProvider. lance-io provides the provider/registry traits;
# the rest are needed to implement object_store::ObjectStore for the wrapper.
lance-io = "=6.0.0"
# Filter cacheability analysis (issue #89): a predicate is planned with the
# same planner and function registry LanceDB uses to run it, then walked for
# functions whose result can change between two identical requests. All three
# are already in the tree through lancedb; naming them here makes the
# dependency explicit rather than transitive. Exact-pinned with the rest of
# the lance family — datafusion 53.1.0 is what lance 6.0.0 resolves to, and
# the versions must agree for the planner's `Expr` to be the type we match on.
#
# The two datafusion subcrates rather than the `datafusion` umbrella on
# purpose: the umbrella's default features pull a Parquet reader and its
# bzip2/lzma/snap/thrift compression stack into the build, none of which this
# analysis touches. `datafusion-common` supplies the expression tree walk and
# `datafusion-expr` the `Expr` and `Volatility` types, which is all of it.
lance-datafusion = "=6.0.0"
datafusion-common = "=53.1.0"
datafusion-expr = "=53.1.0"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
url = "2"
lru = "0.16"

[dev-dependencies]
tempfile = "3"
aws-config.workspace = true
aws-sdk-s3.workspace = true
filetime = "0.2"

[[bench]]
name = "serialisation"
harness = false
